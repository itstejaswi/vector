<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vector">
  <title>Vector</title>

  <!--
    Departing airliner over a runway.

    The artwork is the "plane-departure" icon from Tabler Icons, used under the
    MIT licence and recoloured to the Vector palette. Attribution is in the
    README alongside the other upstream credits.

    Two things are tuned rather than taken as-is. The icon is scaled up and
    inset so it sits with some air in the tile rather than filling it, and the
    stroke is 1.5 rather than Tabler's 2 - a lighter line reads better at the
    sizes this is actually seen at.
  -->

  <defs>
    <linearGradient id="vg" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9e22"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.2" fill="#06070a"/>

  <g transform="translate(2.5 3) scale(1.12)"
     fill="none" stroke="url(#vg)" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.639 10.258l4.83 -1.294a2 2 0 1 1 1.035 3.863l-14.489 3.883l-4.45 -5.02l2.897 -.776l2.45 1.414l2.897 -.776l-3.743 -6.244l2.898 -.777l5.675 5.727"/>
    <path d="M3 21h18"/>
  </g>
</svg>
